name: "Tag Based Integration Deployment"

on:
  workflow_dispatch:
    inputs:
      new_release:
        type: boolean
        description: new release
        required: false
        default: false
      db_migration:
        type: boolean
        description: db migration
        required: false
        default: false

env:
  NAMESPACE: chatwoot

jobs:
  deploy:
    name: "Deploy"
    # same runner as jeeves-app's integration deploy; a bare [self-hosted] could land on the prod-deploy runner.
    runs-on: [self-hosted, python-3.14]
    steps:
      - name: Show target cluster
        run: kubectl config current-context

      - name: Run deployment flow
        run: |
          image_tag="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          image="registry.314ecorp.tech/chatwoot:$image_tag"

          if [ "${{ inputs.new_release }}" == "true" ] && [ "${{ inputs.db_migration }}" == "true" ]; then
            # worker runs 2 replicas; set its image only after migration, so no
            # replica can pick up new code before the schema is ready.
            kubectl set image deployment.apps/chatwoot-web -n "$NAMESPACE" chatwoot-web=$image
            # wait for the rollout so the migration runs in a new-image pod, not a terminating old one.
            kubectl rollout status deployment/chatwoot-web -n "$NAMESPACE" --timeout=10m
            kubectl exec deploy/chatwoot-web -n "$NAMESPACE" -- /bin/bash -c 'RAILS_ENV=production POSTGRES_STATEMENT_TIMEOUT=600s bundle exec rails db:chatwoot_prepare'
            kubectl set image deployment.apps/chatwoot-worker -n "$NAMESPACE" chatwoot-worker=$image
          elif [ "${{ inputs.new_release }}" == "true" ]; then
            kubectl set image deployment.apps/chatwoot-web -n "$NAMESPACE" chatwoot-web=$image
            kubectl set image deployment.apps/chatwoot-worker -n "$NAMESPACE" chatwoot-worker=$image
          elif [ "${{ inputs.db_migration }}" == "true" ]; then
            kubectl exec deploy/chatwoot-web -n "$NAMESPACE" -- /bin/bash -c 'RAILS_ENV=production POSTGRES_STATEMENT_TIMEOUT=600s bundle exec rails db:chatwoot_prepare'
          else
            kubectl rollout restart deployment chatwoot-worker -n "$NAMESPACE"
            kubectl rollout restart deployment chatwoot-web -n "$NAMESPACE"
          fi
